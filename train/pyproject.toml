[project]
name = "ward-train"
version = "0.1.0"
description = "Distils Gemma 4's judgement into Ward Lite, a small on-device classifier"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.8",
  "transformers>=4.56",
  "onnx>=1.18",
  "onnxruntime>=1.22",
  "scikit-learn>=1.7",
  "sentencepiece>=0.2",
  "protobuf>=5",
]
