# Ward's Discord bot as a Render background worker. It holds a gateway connection open, so it
# needs an always-on instance; it serves no web traffic. Set DISCORD_TOKEN and DISCORD_APP_ID in
# the Render dashboard (never in this file). Server mode stays off here: it's a moderator tool
# that needs a safeguarding review before it's offered publicly (docs/SAFEGUARDING.md section 13),
# so this worker runs personal mode only and never asks Discord for message content.
services:
  - type: worker
    name: ward-discord
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@ward/discord..."
    startCommand: pnpm --filter @ward/discord start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_APP_ID
        sync: false
      - key: WARD_SERVER_MODE
        value: "off"

  # The web demo (https://try-ward.onrender.com; https://ward-w8cd.onrender.com is a second static
  # site built the same way, kept so older links still work, with the same headers). Everything runs
  # in the visitor's browser; the only network calls are the optional Gemma demo relay and a local
  # Ollama on the visitor's own machine. The case viewer carries its own stricter meta CSP and needs
  # inline script and style, so it gets its own header instead of the site one.
  - type: web
    runtime: static
    name: ward
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ward/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_WARD_DEMO
        value: "1"
      - key: VITE_GEMMA_DEMO_URL
        value: https://ward-discord.onrender.com/gemma
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://ward-discord.onrender.com http://127.0.0.1:11434 http://localhost:11434; manifest-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
      - path: /ward-viewer.html
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), interest-cohort=()"
