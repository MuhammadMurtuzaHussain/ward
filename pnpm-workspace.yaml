packages:
  - apps/*
  - packages/*
  - desktop
  - mobile
allowBuilds:
  esbuild: true
  electron: true
  # Only needed for Squirrel installers, which Ward doesn't build (NSIS instead).
  electron-winstaller: false
  # transformers.js runs in the browser (ONNX Runtime Web); its Node-only native pieces aren't built.
  onnxruntime-node: false
  protobufjs: false
  # Desktop's bundled Gemma uses node-llama-cpp's prebuilt binaries; never build llama.cpp on install.
  node-llama-cpp: false
