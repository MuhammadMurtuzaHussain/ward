# Weekly update PRs for the pinned GitHub Actions (each pinned to a commit SHA, with its version
# in a comment) and the npm packages in the pnpm workspace. Grouped, so it's one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
