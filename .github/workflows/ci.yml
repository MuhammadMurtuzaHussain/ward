# Typecheck and test every package, and build the web app, on every push. The build fails if
# Ward Lite (ONNX Runtime's wasm and the model) is missing from its output.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # The root script, so CI runs exactly what `pnpm test` runs locally (safety gate and leak tests too).
      - run: pnpm test
      - run: pnpm --filter @ward/web build
